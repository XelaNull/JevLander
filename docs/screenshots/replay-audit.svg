<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="760" viewBox="0 0 1360 760" role="img" aria-labelledby="title desc">
  <title id="title">JevLander replay and audit view</title>
  <desc id="desc">Replay view showing a completed landing, telemetry, a scrubber, and the exact prompt criteria used by Jev.</desc>
  <rect width="1360" height="760" fill="#0a0d16"/>
  <style>
    .text{font-family:Arial,sans-serif;fill:#dfe4f5}.dim{font-family:Arial,sans-serif;fill:#8891ab}.mono{font-family:monospace;fill:#dfe4f5}.label{font-family:Arial,sans-serif;fill:#8891ab;font-size:13px;letter-spacing:1px}.panel{fill:#121729;stroke:#262d47}.small{font-size:13px}.amber{fill:#ffb454}.cyan{fill:#6be6d6}.green{fill:#79e07f}.red{fill:#ff6b6b}
  </style>
  <text x="28" y="42" class="text" font-size="30" font-weight="700">Jev<tspan class="amber">Lander</tspan> <tspan class="dim">Replay</tspan></text>
  <text x="28" y="68" class="dim" font-size="16">Real tick-by-tick episodes · inspect every decision after the flight</text><line x1="28" y1="90" x2="1332" y2="90" stroke="#262d47"/>
  <rect x="28" y="112" width="260" height="602" rx="10" class="panel"/><text x="48" y="142" class="label">EPISODES</text>
  <g font-family="Arial" font-size="15"><rect x="46" y="162" width="224" height="52" rx="7" fill="#171d33" stroke="#ffb454"/><text x="60" y="184" class="text">seed 1042</text><text x="60" y="203" class="dim small">156 ticks</text><text x="252" y="191" class="green mono small" text-anchor="end">LANDED</text>
  <rect x="46" y="224" width="224" height="52" rx="7" fill="#171d33" stroke="#262d47"/><text x="60" y="246" class="text">seed 1041</text><text x="60" y="265" class="dim small">142 ticks</text><text x="252" y="253" class="red mono small" text-anchor="end">CRASHED</text>
  <rect x="46" y="286" width="224" height="52" rx="7" fill="#171d33" stroke="#262d47"/><text x="60" y="308" class="text">seed 1040</text><text x="60" y="327" class="dim small">151 ticks</text><text x="252" y="315" class="green mono small" text-anchor="end">LANDED</text></g>
  <line x1="48" y1="366" x2="268" y2="366" stroke="#262d47"/><text x="48" y="394" class="label">RUN SUMMARY</text><text x="48" y="430" class="dim small">Landing rate</text><text x="268" y="430" class="green mono" text-anchor="end">60 / 60</text><text x="48" y="462" class="dim small">95% Wilson interval</text><text x="268" y="462" class="mono small" text-anchor="end">94.0–100%</text><text x="48" y="494" class="dim small">Mean confidence</text><text x="268" y="494" class="mono" text-anchor="end">0.992</text><text x="48" y="526" class="dim small">Audit records</text><text x="268" y="526" class="mono" text-anchor="end">8,420</text><text x="48" y="670" class="dim small">SQLite audit database</text><text x="48" y="692" class="cyan mono small">runs/D-1042.db</text>
  <rect x="310" y="112" width="690" height="382" rx="10" fill="#05070d" stroke="#262d47"/><rect x="328" y="130" width="86" height="28" rx="5" fill="#0a0d16" stroke="#79e07f"/><text x="371" y="149" class="green mono small" text-anchor="middle">LANDED</text>
  <path d="M328 430 Q400 390 475 410 T620 396 T770 420 T1000 400 V494 H328Z" fill="#171d33"/><path d="M328 430 Q400 390 475 410 T620 396 T770 420 T1000 400" fill="none" stroke="#8891ab" stroke-width="2"/><line x1="660" y1="397" x2="720" y2="397" stroke="#ffb454" stroke-width="5"/>
  <g transform="translate(682 350)"><path d="M0 42 L20 0 L40 42 Z" fill="#dfe4f5" stroke="#79e07f" stroke-width="2"/><rect x="11" y="20" width="18" height="13" rx="3" fill="#171d33" stroke="#6be6d6"/><path d="M5 40 L-10 56 M35 40 L50 56" stroke="#dfe4f5" stroke-width="3"/></g><text x="346" y="474" class="dim mono small">tick 156 · touchdown speed 1.2 m/s</text>
  <rect x="310" y="510" width="690" height="54" rx="7" fill="#171d33" stroke="#262d47"/><rect x="326" y="530" width="636" height="12" rx="6" fill="#262d47"/><rect x="326" y="530" width="636" height="12" rx="6" fill="#79e07f"/><circle cx="962" cy="536" r="8" fill="#ffb454"/><text x="980" y="541" class="dim mono small">t=156 / 156</text>
  <rect x="310" y="584" width="690" height="130" rx="10" class="panel"/><text x="330" y="612" class="text" font-size="17" font-weight="700">Exact prompt criteria</text><text x="980" y="612" class="dim mono small" text-anchor="end">Throttle</text><text x="330" y="640" class="cyan" font-size="13" font-weight="700">TARGET VERTICAL SPEED</text><text x="330" y="662" class="mono">−1.8 m/s</text><text x="330" y="690" class="dim mono small">thrust_50  ·  predicted −1.7 m/s  ·  error 0.1</text>
  <rect x="1026" y="112" width="306" height="602" rx="10" class="panel"/><text x="1046" y="142" class="label">TELEMETRY</text><g class="mono"><text x="1046" y="180" class="dim small">Altitude</text><text x="1312" y="180" text-anchor="end">0.0 m</text><text x="1046" y="214" class="dim small">Velocity</text><text x="1312" y="214" text-anchor="end">−1.2 m/s</text><text x="1046" y="248" class="dim small">Ground speed</text><text x="1312" y="248" text-anchor="end">0.4 m/s</text><text x="1046" y="282" class="dim small">Fuel</text><text x="1312" y="282" class="amber" text-anchor="end">70.5</text><text x="1046" y="316" class="dim small">Angle</text><text x="1312" y="316" class="cyan" text-anchor="end">2.1°</text></g><line x1="1046" y1="344" x2="1312" y2="344" stroke="#262d47"/><text x="1046" y="374" class="label">CONTROL OUTCOMES</text><rect x="1046" y="394" width="246" height="12" rx="3" fill="#79e07f"/><rect x="1046" y="394" width="5" height="12" rx="3" fill="#ffb454"/><text x="1046" y="430" class="dim small">Attitude</text><text x="1292" y="430" class="green mono small" text-anchor="end">155 applied · 1 discard</text><rect x="1046" y="450" width="246" height="12" rx="3" fill="#79e07f"/><text x="1046" y="486" class="dim small">Throttle</text><text x="1292" y="486" class="green mono small" text-anchor="end">156 applied</text><line x1="1046" y1="522" x2="1312" y2="522" stroke="#262d47"/><text x="1046" y="552" class="label">AUDIT</text><text x="1046" y="580" class="dim small">Full request + response</text><text x="1046" y="604" class="dim small">State before + after</text><text x="1046" y="628" class="dim small">Threshold + outcome</text><text x="1046" y="674" class="cyan mono small">Open SQLite log →</text>
</svg>
